[project]
name = "resumable-eval"
version = "1.0.0"
description = "An LLM benchmark run as a Temporal workflow: retries, a fallback provider, a budget, and a resume after the worker is killed."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zuhal Karadavut" }]
dependencies = ["temporalio==1.37.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["resumable_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
